name: Release Neptune

on:
  push:
    tags: ["neptune-v*"]

permissions:
  contents: write
concurrency:
  group: neptune-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  qualification:
    name: Qualify Part 12 before signing
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Record exact candidate checks
        run: |
          python3 scripts/known-problems-gate.py --record unit --command dotnet test tests/Neptune.Core.Tests/Neptune.Core.Tests.csproj -c Release
          python3 scripts/known-problems-gate.py --record linux-package --command bash scripts/verify-linux-package.sh
          python3 scripts/known-problems-gate.py --record windows-package --command dotnet build Neptune.slnx -c Release -p:EnableWindowsTargeting=true
          python3 scripts/known-problems-gate.py --phase pre-signing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: neptune-policy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-evidence/
            known-problems-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux ${{ matrix.runtime }}
    needs: qualification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Resolve version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#neptune-v}"
          [[ "$GITHUB_REF_NAME" == "neptune-v${version}" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$version" = "$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Linux release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          runtime="${{ matrix.runtime }}"
          output="artifacts/${runtime}"
          dotnet publish src/Neptune.Linux/Neptune.Linux.csproj -c Release -r "$runtime" \
            --self-contained true -p:PublishSingleFile=true -p:Version="$version" -o "$output"
          mv "$output/Neptune.Linux" "$output/neptuned"
          cp packaging/linux/install.sh packaging/linux/neptune.service packaging/linux/neptunectl \
            src/Neptune.Linux/appsettings.json "$output/"
          chmod 0755 "$output/neptuned" "$output/install.sh" "$output/neptunectl"
          artifact="neptune-linux-${version}-${runtime}.tar.gz"
          tar -C "$output" -czf "artifacts/$artifact" .
          checksum="$(sha256sum "artifacts/$artifact" | cut -d' ' -f1)"
          size="$(stat -c%s "artifacts/$artifact")"
          printf '%s  %s\n' "$checksum" "$artifact" > "artifacts/${artifact}.sha256"
          printf '{"schema":"exocortex.neptune.release.v1","product":"neptune-linux","protocol_version":1,"version":"%s","runtime":"%s","artifact":"%s","sha256":"%s","size":%s,"minimum_os":"Linux","url":"https://github.com/%s/releases/download/%s/%s"}\n' \
            "$version" "$runtime" "$artifact" "$checksum" "$size" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$artifact" \
            > "artifacts/neptune-linux-release-${runtime}.json"
      - name: Sign trusted Linux manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          if [[ "${{ matrix.runtime }}" == "linux-x64" ]]; then
            node scripts/sign-release.mjs --export-public-key artifacts/neptune.pem \
              artifacts/neptune-linux-release-${{ matrix.runtime }}.json
          else
            node scripts/sign-release.mjs artifacts/neptune-linux-release-${{ matrix.runtime }}.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neptune-release-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.json
            artifacts/*.pem
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows win-x64
    needs: qualification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Resolve version
        id: release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Replace('neptune-v', '')
          if ($env:GITHUB_REF_NAME -ne "neptune-v$version" -or $version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw 'Invalid Neptune release tag.'
          }
          [xml]$props = Get-Content Directory.Build.props
          if ($props.Project.PropertyGroup.VersionPrefix -ne $version) { throw 'Tag version does not match VersionPrefix.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          dotnet publish src/Neptune.Windows/Neptune.Windows.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=$version -o artifacts/win-x64
          if (!(Test-Path artifacts/win-x64/Neptune.Windows.exe)) { throw 'Windows executable was not published.' }
          node scripts/sign-release.mjs --export-public-key artifacts/win-x64/release-trust/neptune.pem
          if ($LASTEXITCODE -ne 0) { throw 'Release trust key could not be exported.' }
          $artifactName = "neptune-windows-$version-win-x64.zip"
          $artifact = "artifacts/$artifactName"
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath $artifact -CompressionLevel Optimal
          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $artifact).Length
          "$hash  $artifactName" | Set-Content "${artifact}.sha256"
          $manifest = @{
            schema = 'exocortex.neptune.release.v1'
            product = 'neptune-windows'
            protocol_version = 1
            version = $version
            runtime = 'win-x64'
            packaging = 'portable-zip'
            artifact = $artifactName
            sha256 = $hash
            size = $size
            minimum_os = 'Windows 10'
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$artifactName"
          } | ConvertTo-Json -Compress
          $manifest | Set-Content artifacts/neptune-windows-release.json
          node scripts/sign-release.mjs artifacts/neptune-windows-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows release manifest could not be signed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neptune-release-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable unified release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: neptune-policy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: neptune-release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
          merge-multiple: true
      - name: Require a pinned Updater with host dependency support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          updater_version="$(cat .release/updater.version)"
          mkdir -p updater-input
          gh release download "updater-v${updater_version}" --repo psewdon1m-exocortex/updater --dir updater-input --pattern "updater-${updater_version}-install.tar.gz"
          printf '%s  %s\n' "$(cat .release/updater.sha256)" "updater-input/updater-${updater_version}-install.tar.gz" | sha256sum -c -
          tar -xzf "updater-input/updater-${updater_version}-install.tar.gz" -C updater-input
          updater-input/updater/updater-linux-amd64 host capabilities | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("schema")=="exocortex.updater.host-dependencies.v1" and d.get("api_version")==1'
          python3 scripts/build-host-bootstrap.py neptune "${GITHUB_REF_NAME#neptune-v}" release/neptune.pem release/bootstrap.sh
          sh -n release/bootstrap.sh
      - name: Verify unified release set
        run: python3 scripts/verify-unified-release.py release
      - name: Stage immutable prerelease candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | join(",")')" = "false,true"
          else
            python3 scripts/verify-published-release.py --asset-names > "$RUNNER_TEMP/neptune-assets.txt"
            mapfile -t names < "$RUNNER_TEMP/neptune-assets.txt"
            assets=()
            for name in "${names[@]}"; do assets+=("release/$name"); done
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --prerelease --latest=false \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Verify anonymously downloaded final release bytes
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          python3 scripts/known-problems-gate.py --record published-assets --command python3 scripts/verify-published-release.py release
          python3 scripts/known-problems-gate.py --phase final
      - name: Attach final qualification report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exists="$(gh release view "$GITHUB_REF_NAME" --json assets --jq 'any(.assets[]; .name == "known-problems-report.json")')"
          if [ "$exists" = false ]; then
            gh release upload "$GITHUB_REF_NAME" known-problems-report.json
          else
            test "$exists" = true
          fi
          unset GH_TOKEN GITHUB_TOKEN
          python3 scripts/verify-published-release.py --verify-report known-problems-report.json
      - name: Promote verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest=false
      - name: Preserve final qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neptune-final-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-evidence/
            known-problems-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
